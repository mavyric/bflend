name: Bitfinex USDT Lender

# HOURLY CADENCE DESIGN
# GitHub throttles this repo's cron heavily: the old "*/10" schedule only
# fired ~every 6h. So the real clock is a SELF-CHAINING run: each run does
# the lending pass, sleeps ~59 min, then dispatches exactly one successor
# via workflow_dispatch (dispatched runs are never throttled). A low-rate
# daily watchdog below re-ignites the chain if the runner dies mid-run
# (the only way the chain can break). The watchdog may cancel a sleeping
# run (cancel-in-progress); its bot step already ran, so at worst one
# extra lending pass per day -- harmless for this idempotent bot.

on:
  schedule:
    # Chain-resurrection watchdog only (not the primary clock).
    - cron: "17 6 * * *"
  workflow_dispatch:
    # Manual run from the Actions tab (also revives the chain).

permissions:
  contents: read
  actions: write

jobs:
  lend:
    # One chain at a time; a watchdog run cancels a sleeping predecessor.
    concurrency:
      group: bflend
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Must cover bot + setup + the ~59m inter-run sleep.
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip' # cache dependencies to speed up runs

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run lending bot
        env:
          BFX_KEY: ${{ secrets.BFX_KEY }}
          BFX_SEC: ${{ secrets.BFX_SEC }}
          # Optional: set a value in your GitHub secrets to prevent lending
          # below a certain APY (e.g. "5" for 5%). lend.py reads this now.
          MIN_APY_GUARD: ${{ secrets.MIN_APY_GUARD }}
        run: python lend.py

      - name: Sleep ~59m then dispatch next hourly run
        # always(): a failed lending pass must NOT break the chain either.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 3540
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/lend.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}"
